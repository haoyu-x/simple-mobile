<!-- Adapted from https://github.com/immersive-web/webxr-samples/blob/main/immersive-ar-session.html -->

<!doctype html>
<html>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'>
    <style>
      body {
        background-color: #F0F0F0;
        font: 1rem/1.4 -apple-system, BlinkMacSystemFont,
          Segoe UI, Roboto, Oxygen,
          Ubuntu, Cantarell, Fira Sans,
          Droid Sans, Helvetica Neue, sans-serif;
      }

      header {
        padding: 0.5em;
        background-color: rgba(255, 255, 255, 0.90);
      }

      #info {
        font-size: 1.25em;
        background-color: rgba(240, 240, 240, 0.5);
      }

      canvas {
        position: absolute;
        z-index: 0;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        margin: 0;
        touch-action: none;
      }

      /* Hex base: bottom half virtual gamepad (local velocity); upper canvas = WebXR arm / right-strip base */
      #gamepad-bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 100;
        height: 50vh;
        max-height: 50vh;
        height: 50dvh;
        max-height: 50dvh;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        padding: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px));
        background: linear-gradient(to top, rgba(20, 22, 28, 0.94), rgba(36, 40, 50, 0.88));
        color: #e8eaef;
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
      }

      #gamepad-bar .gp-pad {
        width: 100%;
        flex: 1 1 0;
        min-height: 0;
        position: relative;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      #gamepad-bar .gp-label {
        position: absolute;
        top: 6px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.58);
        pointer-events: none;
      }

      #gamepad-bar .gp-crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        border-radius: 50%;
        background: rgba(120, 180, 255, 0.5);
        pointer-events: none;
      }

      #gamepad-bar .gp-nub {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 50px;
        height: 50px;
        margin: -25px 0 0 -25px;
        border-radius: 50%;
        background: rgba(100, 160, 255, 0.45);
        border: 2px solid rgba(255, 255, 255, 0.38);
        pointer-events: none;
        transition: transform 0.12s ease-out;
      }

      #gamepad-bar .gp-pad.is-dragging .gp-nub {
        transition: none;
      }

      #gamepad-bar .gp-yaw-track {
        position: absolute;
        left: 14px;
        right: 14px;
        top: 50%;
        height: 10px;
        margin-top: -5px;
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.12);
        pointer-events: none;
      }

      #gamepad-bar .gp-yaw-nub {
        position: absolute;
        top: 50%;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        background: rgba(160, 120, 255, 0.5);
        border: 2px solid rgba(255, 255, 255, 0.38);
        pointer-events: none;
        transition: left 0.12s ease-out;
      }

      #gamepad-bar .gp-pad.is-dragging .gp-yaw-nub {
        transition: none;
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <header></header>
      <p><span id="info"></span></p>
      <div id="gamepad-bar">
        <div id="gp-translate" class="gp-pad gp-pad-move" aria-label="Base translate">
          <span class="gp-label">Base · move (robot)</span>
          <span class="gp-crosshair"></span>
          <span id="gp-translate-nub" class="gp-nub"></span>
        </div>
        <div id="gp-yaw" class="gp-pad gp-pad-yaw gp-yaw-pad" aria-label="Base yaw">
          <span class="gp-label">Yaw (robot)</span>
          <span class="gp-yaw-track"></span>
          <span id="gp-yaw-nub" class="gp-yaw-nub"></span>
        </div>
      </div>
    </div>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script type="text/javascript">
      // Random device ID
      const deviceId = Math.random().toString(36).substring(2, 15);

      // Round-trip time (RTT) statistics
      class RTTStats {
        constructor(bufferSize) {
          this.bufferSize = bufferSize;
          this.bufferIndex = 0;
          this.rttArray = new Array(bufferSize).fill(0); // Initialize the circular buffer
        }

        calculate(rtt) {
          this.rttArray[this.bufferIndex] = rtt;
          this.bufferIndex = (this.bufferIndex + 1) % this.bufferSize;
          const minRtt = Math.min(...this.rttArray);
          const avgRtt = this.rttArray.reduce((acc, cur) => acc + cur, 0) / this.bufferSize;
          const maxRtt = Math.max(...this.rttArray);
          const stdDevRtt = Math.sqrt(this.rttArray.map((x) => (x - avgRtt) ** 2).reduce((acc, cur) => acc + cur, 0) / this.bufferSize);
          return `${minRtt.toFixed(3)}/${avgRtt.toFixed(3)}/${maxRtt.toFixed(3)}/${stdDevRtt.toFixed(3)} ms`;
        }
      }
      const rttStats = new RTTStats(100);

      // Socket to communicate with server
      const socket = io();

      // Calculate RTT from server response
      socket.on('echo', (timestamp) => {
        const rtt = Date.now() - timestamp;
        document.getElementById('info').innerText = rttStats.calculate(rtt);
      });
    </script>
    <script type="module">
      import { WebXRButton } from '/static/js/webxr-button.js';

      // XR globals
      let xrButton = null;
      let xrRefSpace = null;

      // WebGL scene globals
      let gl = null;

      // Virtual base gamepad — streamed at fixed rate during XR session (Hex local velocity)
      const gpState = { x: 0, y: 0, yaw: 0 };
      let gpSendInterval = null;
      let gpTranslateTouchId = undefined;
      let gpYawTouchId = undefined;
      let translateDragging = false;
      let yawDragging = false;

      const GP_DECAY = 0.84;
      const GP_SNAP_EPS = 0.012;

      const translatePad = document.getElementById('gp-translate');
      const translateNub = document.getElementById('gp-translate-nub');
      const yawPad = document.getElementById('gp-yaw');
      const yawNub = document.getElementById('gp-yaw-nub');

      function updateTranslateNubFromState() {
        const r = translatePad.getBoundingClientRect();
        const rad = Math.min(r.width, r.height) * 0.42;
        const nx = gpState.y;
        const ny = gpState.x;
        translateNub.style.transform = `translate(${nx * rad}px, ${ny * rad}px)`;
      }

      function sendBaseGamepad() {
        if (!translateDragging) {
          gpState.x *= GP_DECAY;
          gpState.y *= GP_DECAY;
          if (Math.hypot(gpState.x, gpState.y) < GP_SNAP_EPS) {
            gpState.x = 0;
            gpState.y = 0;
          }
          updateTranslateNubFromState();
        }
        if (!yawDragging) {
          gpState.yaw *= GP_DECAY;
          if (Math.abs(gpState.yaw) < GP_SNAP_EPS) {
            gpState.yaw = 0;
          }
          yawNub.style.left = `${50 + gpState.yaw * 48}%`;
        }

        socket.send({
          timestamp: Date.now(),
          device_id: deviceId,
          base_gamepad: {
            x: gpState.x,
            y: gpState.y,
            yaw: gpState.yaw,
            frame: 'local',
          },
        });
      }

      function startBaseGamepadStream() {
        if (gpSendInterval) return;
        gpSendInterval = setInterval(sendBaseGamepad, 33);
      }

      function stopBaseGamepadStream() {
        if (gpSendInterval) {
          clearInterval(gpSendInterval);
          gpSendInterval = null;
        }
        gpState.x = gpState.y = gpState.yaw = 0;
        translateDragging = yawDragging = false;
        translatePad.classList.remove('is-dragging');
        yawPad.classList.remove('is-dragging');
        translateNub.style.transform = 'translate(0,0)';
        yawNub.style.left = '50%';
        sendBaseGamepad();
      }

      function clampUnitDisk(nx, ny) {
        const L = Math.hypot(nx, ny);
        if (L <= 1) return [nx, ny];
        return [nx / L, ny / L];
      }

      function bindTranslatePad(el, nubEl) {
        function fromTouch(touch) {
          const r = el.getBoundingClientRect();
          const cx = r.left + r.width / 2;
          const cy = r.top + r.height / 2;
          const rad = Math.min(r.width, r.height) * 0.42;
          let nx = (touch.clientX - cx) / rad;
          let ny = (touch.clientY - cy) / rad;
          [nx, ny] = clampUnitDisk(nx, ny);
          gpState.x = ny;
          gpState.y = nx;
          nubEl.style.transform = `translate(${nx * rad}px, ${ny * rad}px)`;
        }
        el.addEventListener('touchstart', (e) => {
          e.preventDefault();
          if (gpTranslateTouchId === undefined) {
            gpTranslateTouchId = e.changedTouches[0].identifier;
            translateDragging = true;
            el.classList.add('is-dragging');
            fromTouch(e.changedTouches[0]);
          }
        }, { passive: false });
        el.addEventListener('touchmove', (e) => {
          e.preventDefault();
          for (const touch of e.changedTouches) {
            if (touch.identifier === gpTranslateTouchId) fromTouch(touch);
          }
        }, { passive: false });
        function endTranslate(e) {
          for (const touch of e.changedTouches) {
            if (touch.identifier === gpTranslateTouchId) {
              gpTranslateTouchId = undefined;
              translateDragging = false;
              el.classList.remove('is-dragging');
            }
          }
        }
        el.addEventListener('touchend', endTranslate);
        el.addEventListener('touchcancel', endTranslate);
      }

      function bindYawPad(el, nubEl) {
        function fromTouch(touch) {
          const r = el.getBoundingClientRect();
          const cx = r.left + r.width / 2;
          const half = Math.max(36, (r.width - 56) * 0.48);
          let t = (touch.clientX - cx) / half;
          t = Math.max(-1, Math.min(1, t));
          gpState.yaw = t;
          nubEl.style.left = `${50 + t * 48}%`;
        }
        el.addEventListener('touchstart', (e) => {
          e.preventDefault();
          if (gpYawTouchId === undefined) {
            gpYawTouchId = e.changedTouches[0].identifier;
            yawDragging = true;
            el.classList.add('is-dragging');
            fromTouch(e.changedTouches[0]);
          }
        }, { passive: false });
        el.addEventListener('touchmove', (e) => {
          e.preventDefault();
          for (const touch of e.changedTouches) {
            if (touch.identifier === gpYawTouchId) fromTouch(touch);
          }
        }, { passive: false });
        function endYaw(e) {
          for (const touch of e.changedTouches) {
            if (touch.identifier === gpYawTouchId) {
              gpYawTouchId = undefined;
              yawDragging = false;
              el.classList.remove('is-dragging');
            }
          }
        }
        el.addEventListener('touchend', endYaw);
        el.addEventListener('touchcancel', endYaw);
      }

      bindTranslatePad(translatePad, translateNub);
      bindYawPad(yawPad, yawNub);

      function initXR() {
        xrButton = new WebXRButton({
          onRequestSession,
          onPrepareEndSession,
          onEndSession,
          textEnterXRTitle: 'Start episode',
          textXRNotFoundTitle: 'AR NOT FOUND',
          textPrepareExitXRTitle: 'End episode',
          textExitXRTitle: 'Reset env',
        });
        document.querySelector('header').appendChild(xrButton.domElement);

        if (navigator.xr) {
          navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
            xrButton.enabled = supported;
          });
        }
      }

      function onRequestSession() {
        return navigator.xr.requestSession('immersive-ar', {
          optionalFeatures: ['dom-overlay'],
          domOverlay: { root: document.getElementById('overlay') },
        }).then((session) => {
          xrButton.setSession(session);
          session.isImmersive = true;
          onSessionStarted(session);
        });
      }

      function onSessionStarted(session) {
        session.addEventListener('end', onSessionEnded);
        const canvas = document.createElement('canvas');
        gl = canvas.getContext('webgl', {
          xrCompatible: true,
        });
        addCanvasListeners(gl.canvas);
        session.updateRenderState({ baseLayer: new XRWebGLLayer(session, gl) });
        session.requestReferenceSpace('local').then((refSpace) => {
          xrRefSpace = refSpace;
          session.requestAnimationFrame(onXRFrame);
        });

        // Let the server know user has started the episode
        const data = { timestamp: Date.now(), state_update: 'episode_started' };
        socket.send(data);
        startBaseGamepadStream();
      }

      function onPrepareEndSession() {
        // Let the server know user has ended the episode
        const data = { timestamp: Date.now(), state_update: 'episode_ended' };
        socket.send(data);
      }

      function onEndSession(session) {
        session.end();

        // Let the server know user is ready for env reset
        const data = { timestamp: Date.now(), state_update: 'reset_env' };
        socket.send(data);
      }

      function onSessionEnded(event) {
        stopBaseGamepadStream();
        xrButton.setSession(null);
        gl = null;
      }

      // Touch event handling
      let touchId; let touchStartY; let touchDeltaY; let teleopMode;
      function addCanvasListeners(canvas) {
        function handleTouch(touch) {
          touchDeltaY = (touchStartY - touch.clientY) / (0.2 * window.innerHeight);
          touchDeltaY = Math.min(1, Math.max(-1, touchDeltaY));
        }

        canvas.addEventListener('touchstart', (event) => {
          if (touchId === undefined) {
            const touch = event.changedTouches[0];
            touchId = touch.identifier;
            touchStartY = touch.clientY;
            teleopMode = touch.clientX < 0.9 * window.innerWidth ? 'arm' : 'base';
            handleTouch(touch);
          }
        });

        canvas.addEventListener('touchmove', (event) => {
          for (const touch of event.changedTouches) {
            if (touchId === touch.identifier) {
              handleTouch(touch);
            }
          }
        });

        function updateTouchIds(event) {
          for (const touch of event.changedTouches) {
            if (touchId === touch.identifier) {
              touchId = undefined;
            }
          }
        }
        canvas.addEventListener('touchend', updateTouchIds);
        canvas.addEventListener('touchcancel', updateTouchIds);
      }

      function onXRFrame(t, frame) {
        frame.session.requestAnimationFrame(onXRFrame);

        // Visualize status of touch control
        const r = (touchId !== undefined && teleopMode === 'base') ? 0.25 : 0;
        const b = (touchId !== undefined && teleopMode === 'arm')
          ? (Math.abs(touchDeltaY) === 1 ? 1 : 0.25 + 0.25 * touchDeltaY)
          : 0;
        gl.clearColor(r, 0, b, 0.5);
        gl.clear(gl.COLOR_BUFFER_BIT);

        // Send data to server
        const data = { timestamp: Date.now(), device_id: deviceId };
        if (touchId !== undefined) {
          const pose = frame.getViewerPose(xrRefSpace);
          if (pose) {
            data.teleop_mode = teleopMode;
            data.position = {
              x: pose.transform.inverse.position.x,
              y: pose.transform.inverse.position.y,
              z: pose.transform.inverse.position.z,
            };
            data.orientation = {
              x: pose.transform.inverse.orientation.x,
              y: pose.transform.inverse.orientation.y,
              z: pose.transform.inverse.orientation.z,
              w: pose.transform.inverse.orientation.w,
            };
          }
          if (teleopMode === 'arm') {
            data.gripper_delta = touchDeltaY;
          }
        }
        socket.send(data);
      }

      initXR();
    </script>
  </body>
</html>
